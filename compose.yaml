services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: h3o
      POSTGRES_USER: h3o
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U h3o"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
